name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The deterministic layer needs no API key, so it runs on every PR (incl. forks) with no secrets.
      - run: npm run eval -- --checks-only --quiet --output-dir "$RUNNER_TEMP/howdah-checks"
      - run: npm run compare -- --checks-only --trials 2 --quiet --output-dir "$RUNNER_TEMP/howdah-comparisons"
